*{box-sizing:border-box}

const pad=n=>String(n).padStart(2,'0');
const stamp=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
function nextDate(byday,time){
  const idx={SU:0,MO:1,TU:2,WE:3,TH:4,FR:5,SA:6};const [h,m]=time.split(':').map(Number);
  const now=new Date();let best=null;
  byday.forEach(d=>{const t=new Date(now);t.setHours(h,m,0,0);let add=(idx[d]-now.getDay()+7)%7;if(add===0&&t<=now)add=7;t.setDate(now.getDate()+add);if(!best||t<best)best=t});
  return best;
}
function semEndDate(){const now=new Date();return now.getMonth()<7?new Date(now.getFullYear(),5,30,20,0):new Date(now.getFullYear(),11,20,20,0)}
function untilUTC(){const e=semEndDate();const u=new Date(e.getFullYear(),e.getMonth(),e.getDate(),23,59,59);const p=n=>String(n).padStart(2,'0');return `${u.getUTCFullYear()}${p(u.getUTCMonth()+1)}${p(u.getUTCDate())}T${p(u.getUTCHours())}${p(u.getUTCMinutes())}${p(u.getUTCSeconds())}Z`}
function blockRule(days){return 'FREQ=WEEKLY;BYDAY='+days.join(',')+';UNTIL='+untilUTC()}
function gcal({title,start,dur,rrule,details}){
  const end=new Date(start.getTime()+dur*60000);
  const p=new URLSearchParams({action:'TEMPLATE',text:title,dates:`${stamp(start)}/${stamp(end)}`,ctz:'Asia/Seoul',details:details||'MOA  '});
  if(rrule)p.set('recur','RRULE:'+rrule);

}

function wrap(ctx,text,x,y,maxW,lh,maxLines){const words=String(text).split('');let line='',lines=[];for(const ch of words){if(ctx.measureText(line+ch).width>maxW){lines.push(line);line=ch}else line+=ch}if(line)lines.push(line);lines=lines.slice(0,maxLines||9);lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lh));return lines.length*lh}
function rr(ctx,x,y,w,h,r,fill){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();ctx.fillStyle=fill;ctx.fill()}
