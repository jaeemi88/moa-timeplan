<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>2주 실천 체크 · 시간 설계도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{--bg:#D6E8FD;--fg:#0F1E3D;--muted:#4A5B7A;--line:#BCD6F5;--pink:#FF3D6E;--orange:#EA6A0C;--font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;justify-content:space-between;padding-bottom:14px;border-bottom:2px solid var(--fg);font-size:13px;font-weight:900;letter-spacing:.04em}
header span{color:var(--muted);font-weight:700;letter-spacing:0}
h1{font-size:40px;font-weight:900;letter-spacing:-.04em;line-height:1.1;margin:26px 0 10px}
h1 .hl{display:inline-block;background:var(--pink);color:#fff;padding:0 .14em;border-radius:4px;margin-top:6px}
.lead{font-weight:500;margin:0 0 18px}
.q{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:inset 0 4px 0 var(--orange)}
.q b{display:block;margin-bottom:10px;font-size:16px}
.opts{display:grid;gap:6px}
.opts.row{grid-template-columns:repeat(5,1fr)}.opts.two{grid-template-columns:1fr 1fr}
.opts button{padding:11px 6px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-size:14px;color:var(--fg);cursor:pointer}
.opts button[aria-pressed=true]{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:700}
.scale{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}
.btn{width:100%;padding:13px;border-radius:12px;border:0;background:var(--fg);color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer;margin-top:6px}
.err{color:#C2410C;font-size:13px;font-weight:700;min-height:1.2em;margin-top:8px}
.done{background:#fff;border-radius:16px;padding:22px 18px;text-align:center}
.done b{font-size:22px;font-weight:900;display:block;margin-bottom:6px}
.done a{display:inline-block;margin-top:14px;color:var(--fg);font-weight:700}
.hide{display:none}
footer{display:flex;align-items:center;gap:8px;margin-top:30px;padding-top:14px;border-top:2px solid var(--fg);font-weight:700;font-size:14px}
footer img{width:28px;height:28px}
</style></head><body>
<div class="wrap">
  <header>MOA FORMULA<span>2주 실천 체크</span></header>
  <h1>2주 동안<br><span class="hl">어땠나요?</span></h1>
  <p class="lead" id="lead">질문 3개, 1분이면 끝나요. 이름은 받지 않아요.</p>
  <div id="form">
    <div class="q"><b>1. 내가 만든 타임블록을 몇 번 지켰나요?</b>
      <div class="opts two" id="kept"><button type="button" data-v="0">한 번도 못 했어요</button><button type="button" data-v="1">1~2번</button><button type="button" data-v="2">3~5번</button><button type="button" data-v="3">6번 이상</button></div></div>
    <div class="q"><b>2. 일요일 10분 리뷰를 해 봤나요?</b>
      <div class="opts two" id="review"><button type="button" data-v="1">네, 해 봤어요</button><button type="button" data-v="0">아직이요</button></div></div>
    <div class="q"><b>3. 앞으로도 시간 설계도를 계속 쓸 건가요?</b>
      <div class="opts row" id="keep"><button type="button" data-v="1">1</button><button type="button" data-v="2">2</button><button type="button" data-v="3">3</button><button type="button" data-v="4">4</button><button type="button" data-v="5">5</button></div>
      <div class="scale"><span>아니요</span><span>꼭 계속할래요</span></div></div>
    <button class="btn" id="send" type="button">보내기</button>
    <div class="err" id="err"></div>
  </div>
  <div class="done hide" id="done"><b>고마워요!</b>지킨 블록이 1개라도 있다면 이미 시작한 거예요.<br>못 지켰다면, 블록 시간을 바꿔서 다시 넣어 보세요.<br><a id="back" href="/">내 시간 설계도 열기 →</a></div>
  <footer><img src="/logo.png" alt="" width="28" height="28">진로모아커리어센터</footer>
</div>
<script>
const q=new URLSearchParams(location.search);const code=(q.get('c')||'').toUpperCase();const sid=q.get('s')||'';const lv=q.get('l');
if(lv==='high')document.getElementById('back').href='/high/';
const ans={};
['kept','review','keep'].forEach(k=>document.getElementById(k).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;ans[k]=+b.dataset.v;
  document.getElementById(k).querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.getElementById('err').textContent=''}));
if(!code){document.getElementById('lead').textContent='수업에서 받은 캘린더 일정의 링크로 열어 주세요.'}
document.getElementById('send').addEventListener('click',async()=>{
  const err=document.getElementById('err');
  if(ans.kept===undefined||ans.review===undefined||ans.keep===undefined){err.textContent='3개 질문에 모두 답해 주세요.';return}
  if(!code){err.textContent='수업 코드가 없는 링크예요. 캘린더 일정 안의 링크로 열어 주세요.';return}
  const b=document.getElementById('send');b.disabled=true;b.textContent='보내는 중…';
  try{const r=await fetch('/api/class',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({a:'check',code,sid,kept:ans.kept,review:!!ans.review,keep:ans.keep})});
    const j=await r.json();if(!r.ok)throw new Error(j.error||'오류');
    document.getElementById('form').classList.add('hide');document.getElementById('done').classList.remove('hide')}
  catch(e){err.textContent=e.message||'잠시 후 다시 보내 주세요.';b.disabled=false;b.textContent='보내기'}
});
</script>
</body></html>
