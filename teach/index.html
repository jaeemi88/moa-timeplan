<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>  ·   </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{--bg:#D6E8FD;--surface:#fff;--line:#BCD6F5;--fg:#0F1E3D;--muted:#4A5B7A;--pink:#FF3D6E;--pink-soft:#FFE4EB;--blue:#2F6BFF;--green:#0E9563;--orange:#EA6A0C;--soft:#E8F1FE;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:14px;border-bottom:2px solid var(--fg)}
.logo{font-weight:900;font-size:13px;letter-spacing:.06em}.logo span{font-weight:700;letter-spacing:0}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--muted)}
h1{font-size:34px;font-weight:900;letter-spacing:-.03em;line-height:1.15;margin:22px 0 14px}
h1 .hl{display:inline-block;background:var(--pink);color:#fff;padding:.02em .14em .06em;border-radius:4px;margin-top:8px;line-height:1.1}
.lead{margin:0 0 18px;font-weight:500}
.card{background:var(--surface);border-radius:16px;padding:16px 18px}
.grid{display:grid;gap:12px}
@media(min-width:860px){.dash{grid-template-columns:320px 1fr}.stats{grid-template-columns:repeat(4,1fr)}}
.stats{grid-template-columns:repeat(2,1fr)}
.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:13px;font-weight:700}
input[type=text]{font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--fg);width:100%}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-size:14px;cursor:pointer;color:var(--fg)}
.seg button[aria-pressed=true]{background:var(--fg);color:#fff;border-color:var(--fg);font-weight:700}
.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:12px;background:#fff;color:var(--fg);border:1.5px solid var(--fg);font:inherit;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none}
.tbtn.full{width:100%}
.tbtn svg,.tag svg{width:15px;height:15px}
.qrbox{display:grid;justify-items:center;gap:8px;text-align:center}
#qr{background:#fff;padding:10px;border-radius:12px}#qr img,#qr canvas{display:block;width:220px!important;height:220px!important}
.code{font-size:44px;font-weight:900;letter-spacing:.12em;color:var(--pink);line-height:1}
.small{font-size:12px;color:var(--muted);word-break:break-all}
.stat small{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.stat b{font-size:34px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.stat span{font-size:14px;font-weight:700;margin-left:2px}
.stat.hl b{color:var(--pink)}
h2{font-size:17px;font-weight:900;margin:0 0 12px}
.bar{display:grid;grid-template-columns:128px 1fr 56px;gap:10px;align-items:center;margin:9px 0;font-size:14px;font-weight:700}
.bar i{display:block;height:16px;border-radius:8px;background:var(--soft);overflow:hidden}
.bar i em{display:block;height:100%;border-radius:8px;background:var(--c,var(--fg));transition:width .5s}
.bar output{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.hist{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:6px}
.hist div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:12px;color:var(--muted);font-weight:700}
.hist div i{width:100%;background:var(--pink);border-radius:8px 8px 3px 3px;min-height:3px;transition:height .5s}
.hist div b{color:var(--fg);font-size:13px}
.say{background:var(--pink-soft);border-radius:12px;padding:12px 14px;font-weight:700;margin-top:10px}
.say b{color:var(--pink)}
.recent a{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line);color:var(--fg);text-decoration:none;font-weight:700}
.recent a small{color:var(--muted);font-weight:500}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--green)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.25}}
.err{color:#C2410C;font-size:13px;font-weight:700;min-height:1em;margin-top:8px}
.hide{display:none!important}
.row{display:flex;gap:8px;flex-wrap:wrap}
footer{display:flex;align-items:center;gap:8px;margin-top:28px;padding-top:14px;border-top:2px solid var(--fg);font-weight:700;font-size:14px}
footer img{width:28px;height:28px}
/*   (2026-10-29 ·    ,  ) */
.hrt{display:flex;align-items:center;gap:10px;flex:none}
.logo span{white-space:nowrap}
.hub{flex:none;font-size:13px;font-weight:500;color:#1F3A6E;text-decoration:none;border:1px solid #1F3A6E;border-radius:999px;padding:6px 12px;white-space:nowrap;background:#FFFFFF}
@media print{.hub{display:none!important}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></symbol></svg>
<div class="wrap">
  <header><div class="logo">MOA FORMULA<span> ·  </span></div><div class="hrt"><div class="tag"><svg><use href="#lock"/></svg> </div><a class="hub" href="https://moa-hub.vercel.app/"></a></div></header>

  <!--   -->
  <section id="setup" class="hide">
    <h1> <br><span class="hl"> </span></h1>
    <p class="lead">   QR .         .</p>
    <div class="grid" style="max-width:560px">
      <div class="card">
        <div class="field"><label for="title"> </label><input id="title" type="text" maxlength="40" placeholder=")   3 1"></div>
        <div class="field"><label></label><div class="seg" id="level"><button type="button" data-v="uni" aria-pressed="true"></button><button type="button" data-v="high" aria-pressed="false"></button></div></div>
        <div class="field"><label for="dept"> <span class="small">( ·        )</span></label><input id="dept" type="text" maxlength="20" placeholder=")  ·  · "></div>
        <button class="tbtn full" id="create" type="button"><svg><use href="#lock"/></svg> </button>
        <div class="err" id="err1"></div>
      </div>
      <div class="card recent hide" id="recentBox"><h2>  </h2><div id="recent"></div></div>
    </div>
  </section>

  <!--  -->
  <section id="dash" class="hide">
    <h1 id="dTitle"> </h1>
    <p class="lead"><span class="live"></span> <span class="small" id="upd"></span></p>
    <div class="grid dash">
      <div class="grid" style="align-content:start">
        <div class="card qrbox">
          <h2 style="margin:0" id="qrH">  QR</h2>
          <div id="qr"></div>
          <div class="small"> </div><div class="code" id="dCode">----</div>
          <div class="small" id="sUrl"></div>
          <div class="small"> ·     ·  ·    .</div>
        </div>
        <div class="card"><div class="row">
          <button class="tbtn" id="copyLink" type="button"><svg><use href="#lock"/></svg>  </button>
          <button class="tbtn" id="newClass" type="button"> </button></div>
          <p class="small" style="margin:10px 0 0">        .   .</p></div>
      </div>
      <div class="grid" style="align-content:start">
        <div class="grid stats">
          <div class="card stat"><small> </small><b id="sN">0</b><span></span></div>
          <div class="card stat"><small>   </small><b id="sPhone">0</b><span>/</span></div>
          <div class="card stat"><small>  </small><b id="sFree">0</b><span>/</span></div>
          <div class="card stat hl"><small> </small><b id="sBlocks">0</b><span></span></div>
        </div>
        <div class="card">
          <h2>  </h2>
          <div class="grid stats" style="grid-template-columns:1fr 1fr">
            <div class="stat"><small>  </small><b id="sFreeT">0</b><span></span></div>
            <div class="stat hl"><small>   1 </small><b id="sGain">0</b><span></span></div>
          </div>
          <div class="say" id="sSay">      .</div>
        </div>
        <div class="card">
          <h2> </h2>
          <div class="bar" style="--c:var(--pink)"> ·  <i><em id="bJin" style="width:0"></em></i><output id="oJin">0/0</output></div>
          <div class="bar" style="--c:var(--blue)"> ·  ·  <i><em id="bJang" style="width:0"></em></i><output id="oJang">0/0</output></div>
          <div class="bar" style="--c:var(--green)"> ·  <i><em id="bDan" style="width:0"></em></i><output id="oDan">0/0</output></div>
          <div class="bar" style="--c:var(--orange)"> ·  <i><em id="bJeom" style="width:0"></em></i><output id="oJeom">0/0</output></div>
        </div>
        <div class="card">
          <h2>    </h2>
          <div class="hist" id="hist"></div>
        </div>
        <div class="card">
          <h2>   </h2>
          <div id="paths" class="small">   .</div>
        </div>
        <div class="card">
          <h2>2   </h2>
          <p class="small" style="margin:-6px 0 10px">  2  ' '  .    .</p>
          <div class="grid stats" style="grid-template-columns:repeat(3,1fr)">
            <div class="stat"><small></small><b id="cN">0</b><span></span></div>
            <div class="stat hl"><small> 1  </small><b id="cKept">0</b><span>%</span></div>
            <div class="stat"><small> </small><b id="cKeep">0</b><span>/ 5</span></div>
          </div>
          <div class="say" id="report">     .</div>
          <button class="tbtn" id="copyReport" type="button" style="margin-top:10px">  </button>
        </div>
      </div>
    </div>
  </section>

  <footer><img src="/logo.png" alt="" width="28" height="28"></footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $=s=>document.querySelector(s);const fmt=n=>Math.round(n).toLocaleString('ko-KR');const f1=n=>(Math.round(n*10)/10).toLocaleString('ko-KR');
const RKEY='moa-tp-teach';
function recent(){try{return JSON.parse(localStorage.getItem(RKEY)||'[]')}catch(e){return[]}}
function remember(c){try{const l=recent().filter(x=>x.code!==c.code);l.unshift(c);localStorage.setItem(RKEY,JSON.stringify(l.slice(0,12)))}catch(e){}}
let level='uni';
$('#level').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;level=b.dataset.v;$('#level').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
async function api(body){const r=await fetch('/api/class',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({error:'  .'}));if(!r.ok)throw new Error(j.error||'');return j}
$('#create').addEventListener('click',async()=>{const b=$('#create');b.disabled=true;$('#err1').textContent='';
  try{const j=await api({a:'create',title:$('#title').value.trim(),level,dept:$('#dept').value.trim()});
    remember({code:j.code,key:j.key,title:j.title,level:j.level,dept:$('#dept').value.trim(),t:Date.now()});
    location.search='?c='+j.code+'&k='+j.key}catch(e){$('#err1').textContent=e.message}finally{b.disabled=false}});
function studentUrl(c){const base=location.origin+(c.level==='high'?'/high/':'/');const p=new URLSearchParams({c:c.code});if(c.dept)p.set('d',c.dept);return base+'?'+p.toString()}
let timer=null,last=null;
async function load(c){
  try{const r=await fetch('/api/class?a=dash&code='+c.code+'&key='+c.key,{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error);last=d;draw(d);$('#upd').textContent=new Date().toLocaleTimeString('ko-KR')+'  · 5 '}
  catch(e){$('#upd').textContent=e.message}
}
function setBar(id,v,n){$('#b'+id).style.width=(n?Math.round(v/n*100):0)+'%';$('#o'+id).textContent=v+'/'+n}
function draw(d){
  $('#dTitle').innerHTML=d.title.replace(/[<>&]/g,'')+'<br><span class="hl"> </span>';
  $('#sN').textContent=d.n;$('#sPhone').textContent=f1(d.phone);$('#sFree').textContent=f1(d.free);$('#sBlocks').textContent=d.blocks;
  $('#sFreeT').textContent=fmt(d.freeTotal);$('#sGain').textContent=fmt(d.gain);
  if(d.n)$('#sSay').innerHTML=`  ${d.n}   1 ,  <b>${fmt(d.gain)}</b> .   <b>${fmt(d.gain/d.n)}</b>.`;
  setBar('Jin',d.steps.jin,d.n);setBar('Jang',d.steps.jang,d.n);setBar('Dan',d.steps.dan,d.n);setBar('Jeom',d.steps.jeom,d.n);
  const L=['2 ','2~4','4~6','6~8','8 '];const mx=Math.max(1,...d.hist);
  $('#hist').innerHTML=d.hist.map((v,i)=>`<div><b>${v}</b><i style="height:${Math.round(v/mx*100)}%"></i>${L[i]}</div>`).join('');
  const P=Object.entries(d.paths).sort((a,b)=>b[1]-a[1]);
  $('#paths').innerHTML=P.length?P.map(([k,v])=>`<div class="bar" style="--c:var(--blue)">${k}<i><em style="width:${Math.round(v/d.n*100)}%"></em></i><output>${v}</output></div>`).join(''):'   .';
  const k=d.check;$('#cN').textContent=k.n;$('#cKept').textContent=k.n?Math.round(k.kept1/k.n*100):0;$('#cKeep').textContent=k.n?f1(k.keep):0;
  $('#report').textContent=k.n?`  ${d.n}  ${k.n} 2    ,  ${Math.round(k.kept1/k.n*100)}%    1  .    ${Math.round(k.review/k.n*100)}%,    ${f1(k.keep)}(5 ).`:'     .';
}
async function copy(t,btn){try{await navigator.clipboard.writeText(t);const o=btn.innerHTML;btn.textContent='';setTimeout(()=>btn.innerHTML=o,1500)}catch(e){prompt(' ',t)}}
function start(){
  const q=new URLSearchParams(location.search);const code=(q.get('c')||'').toUpperCase(),key=q.get('k')||'';
  const R=recent();
  if(!code||!key){$('#setup').classList.remove('hide');
    if(R.length){$('#recentBox').classList.remove('hide');$('#recent').innerHTML=R.map(c=>`<a href="?c=${c.code}&k=${c.key}">${c.title.replace(/[<>&]/g,'')}<small>${c.code} · ${c.level==='high'?'':''} · ${new Date(c.t).toLocaleDateString('ko-KR')}</small></a>`).join('')}
    return}
  const saved=R.find(x=>x.code===code)||{};const c={code,key,level:saved.level||'uni',dept:saved.dept||''};
  $('#dash').classList.remove('hide');$('#dCode').textContent=code;
  fetch('/api/class?a=info&code='+code).then(r=>r.json()).then(i=>{if(i.level){c.level=i.level;c.dept=i.dept||c.dept}
    //      (2026-10-28):   QR    QR  
    if(i.hub){$('#qrH').textContent=' ';$('#qr').innerHTML='<div class="small" style="max-width:260px;line-height:1.7">  <b>   '+String(i.hub).replace(/[^0-9]/g,'')+'</b> .<br>  QR  [  ]     .</div>';$('#sUrl').textContent='';
      if(!saved.code)remember({code,key,title:i.title||code,level:c.level,dept:c.dept,t:Date.now()});return}
    const u=studentUrl(c);$('#sUrl').textContent=decodeURIComponent(u.replace(/^https?:\/\//,''));$('#qr').innerHTML='';
    try{new QRCode($('#qr'),{text:u,width:440,height:440,colorDark:'#0F1E3D',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(e){$('#qr').innerHTML='<div class="small" style="width:220px">QR  .     .</div>'}
    if(!saved.code)remember({code,key,title:i.title||code,level:c.level,dept:c.dept,t:Date.now()})}).catch(()=>{});
  $('#copyLink').addEventListener('click',e=>copy(location.href,e.currentTarget));
  $('#copyReport').addEventListener('click',e=>copy($('#report').textContent,e.currentTarget));
  $('#newClass').addEventListener('click',()=>{location.search=''});
  load(c);timer=setInterval(()=>{if(!document.hidden)load(c)},5000);
}
start();
//   (2026-10-24 · 2 ):      (·   )
function moaUse(s){try{var k=String(s),t=Date.now(),m=window.__moaUse||(window.__moaUse={});if(m[k]&&t-m[k]<600000)return;m[k]=t;var u='https://jinromoa-board.vercel.app/api/usage',b=JSON.stringify({a:'tp',s:k});if(navigator.sendBeacon)navigator.sendBeacon(u,b);else fetch(u,{method:'POST',body:b,keepalive:true,mode:'no-cors'})}catch(e){}}
moaUse('class');
</script>
</body></html>
